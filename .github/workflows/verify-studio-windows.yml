name: Verify Studio Windows installer (artifact-only, no tag/Release)

# Manually triggered ONLY (`workflow_dispatch`) — deliberately separate from
# release-studio-windows.yml, which is tag-triggered and creates a real
# GitHub Release via tauri-apps/tauri-action. This workflow exists to build
# and verify a real Windows installer from an arbitrary commit WITHOUT
# creating a Git tag or a GitHub Release — it uploads the installer, its
# SHA-256 checksum, and a release-candidate manifest as a plain GitHub
# Actions build artifact (auto-expiring, not a Release asset).
#
# Same windows-latest constraint as release-studio-windows.yml applies —
# see that workflow's own header comment for why macOS cross-compilation
# is infeasible in this project's actual toolchain.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/studio/src-tauri

      - run: pnpm install --frozen-lockfile

      # The same gate release-studio-windows.yml and ci.yml's studio-frontend
      # job both run — a verification build is worthless if it ships a
      # binary the test suite wouldn't have allowed to release.
      - run: pnpm run check:architecture
      - run: pnpm run check:boundaries
      - run: pnpm run lint
      - run: pnpm --filter @fdraft/theme-sdk typecheck
      - run: pnpm --filter @fdraft/theme-sdk test
      - run: pnpm --filter @fdraft/theme-sdk build
      - run: pnpm --filter @fdraft/theme-renderer typecheck
      - run: pnpm --filter @fdraft/theme-renderer test
      - run: pnpm --filter @fdraft/theme-renderer build
      - run: pnpm --filter @fdraft/studio typecheck
      - run: pnpm --filter @fdraft/studio test

      - name: Build the real NSIS installer
        run: pnpm --filter @fdraft/studio tauri:build

      # Renames the bundler's own output to the required artifact-name
      # convention, computes its SHA-256, and writes a machine-readable
      # candidate manifest describing exactly this build — never a
      # different one. testedFdraftVersion/testedFdraftCommit are left
      # null here: this job never checks out or runs FDraft, so it cannot
      # honestly claim that verification — a separate, manual step against
      # a real FDraft checkout fills those in before the candidate is
      # considered fully verified (see docs/guides/RELEASE_CHECKLIST.md).
      - name: Package artifacts and candidate manifest
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $appVersion = (node -p "require('./apps/studio/package.json').version")
          $sdkVersion = (node -p "require('./packages/theme-sdk/package.json').version")
          $rendererVersion = (node -p "require('./packages/theme-renderer/package.json').version")
          # versions.ts is TS, not JSON — read the two constants directly rather than requiring it.
          $versionsSrc = Get-Content -Raw "packages/theme-sdk/src/schema/versions.ts"
          $projectFormatVersion = [regex]::Match($versionsSrc, 'CURRENT_PROJECT_FORMAT_VERSION\s*=\s*"([^"]+)"').Groups[1].Value
          $minProjectFormatVersion = [regex]::Match($versionsSrc, 'MIN_SUPPORTED_PROJECT_FORMAT_VERSION\s*=\s*"([^"]+)"').Groups[1].Value
          $themeFormatVersion = [regex]::Match($versionsSrc, 'CURRENT_THEME_FORMAT_VERSION\s*=\s*"([^"]+)"').Groups[1].Value

          $bundleDir = "apps/studio/src-tauri/target/release/bundle/nsis"
          $installer = Get-ChildItem -Path $bundleDir -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "No NSIS .exe installer found under $bundleDir"
          }

          $artifactName = "FDraft-Studio-$appVersion-Windows-x64-Setup.exe"
          $outDir = "dist-release"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          $artifactPath = Join-Path $outDir $artifactName
          Copy-Item $installer.FullName $artifactPath

          $hash = (Get-FileHash -Path $artifactPath -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item $artifactPath).Length
          "$hash  $artifactName" | Out-File -FilePath (Join-Path $outDir "$artifactName.sha256") -Encoding ascii -NoNewline

          $manifest = [ordered]@{
            appVersion               = $appVersion
            sourceCommitSha          = "$env:GITHUB_SHA"
            windowsTarget            = "x64"
            cpuArchitecture          = "x64"
            installerFormat          = "nsis"
            installerFilename        = $artifactName
            fileSizeBytes            = $size
            sha256                   = $hash
            sdkVersion               = $sdkVersion
            rendererVersion          = $rendererVersion
            themeFormatVersion       = $themeFormatVersion
            projectFormatVersion     = $projectFormatVersion
            minSupportedProjectFormatVersion = $minProjectFormatVersion
            minCompatibleFdraftRef   = "commit 006035c on branch feature/fdraft-theme-runtime (first FDraft commit supporting all 14 default-template component keys plus the behaviour/effects capabilities) or later, pinned to theme-runtime-v0.1.0"
            testedFdraftVersion      = $null
            testedFdraftCommit       = $null
            signingStatus            = "unsigned — no Authenticode certificate available for this project"
            buildTimestampUtc        = (Get-Date).ToUniversalTime().ToString("o")
            testedWindowsVersions    = @("windows-latest GitHub Actions runner (Windows Server 2022) — no additional Windows version tested yet")
            tutorialVersion          = "1"
            tutorialContentRevision  = "$env:GITHUB_SHA"
          }
          $manifest | ConvertTo-Json -Depth 5 | Out-File -FilePath (Join-Path $outDir "candidate-manifest.json") -Encoding utf8

          Write-Host "Installer: $artifactPath"
          Write-Host "SHA-256:   $hash"
          Get-Content (Join-Path $outDir "candidate-manifest.json")

          echo "artifact_name=$artifactName" >> $env:GITHUB_OUTPUT
          echo "sha256=$hash" >> $env:GITHUB_OUTPUT

      # Scriptable slice of the packaged-application verification checklist:
      # everything a headless windows-latest runner can actually prove
      # (silent install, registry/shortcut/file presence, a launch smoke
      # check, silent uninstall, and that uninstall never removes user
      # app-data). What this CANNOT prove — real SmartScreen dialog
      # wording, visual Start Menu/taskbar icon rendering, human-driven
      # GUI walkthroughs — is left unverified here and reported as such,
      # not fabricated.
      - name: Verify silent install, launch smoke-check, and silent uninstall
        id: install-verify
        shell: pwsh
        env:
          ARTIFACT_NAME: ${{ steps.package.outputs.artifact_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $artifactPath = (Resolve-Path "dist-release/$env:ARTIFACT_NAME").Path
          $appVersion = (node -p "require('./apps/studio/package.json').version")
          $results = [ordered]@{}

          function Check([string]$name, [bool]$condition) {
            $script:results[$name] = $condition
            if (-not $condition) { Write-Host "::error::Verification check failed: $name" }
            else { Write-Host "OK: $name" }
          }

          function Find-UninstallEntry {
            $roots = @(
              "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
              "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
              "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
            )
            Get-ItemProperty -Path $roots -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -eq "FDraft Studio" } | Select-Object -First 1
          }

          # --- Silent install. installMode is "currentUser" (tauri.conf.json), so
          # no elevation prompt and no admin rights are needed — matches the
          # requirement that Studio avoid admin access unless technically necessary. ---
          $proc = Start-Process -FilePath $artifactPath -ArgumentList "/S" -PassThru -Wait
          Check "silent install process exits 0" ($proc.ExitCode -eq 0)

          # NSIS's outer stub can return before the real install work (registry
          # writes, shortcut creation) is fully committed — poll briefly rather
          # than trusting a single immediate read.
          $entry = $null
          for ($i = 0; $i -lt 10 -and -not $entry; $i++) {
            $entry = Find-UninstallEntry
            if (-not $entry) { Start-Sleep -Seconds 1 }
          }
          Check "uninstall registry entry created" ($null -ne $entry)

          $installLocation = $null
          $exePath = $null
          if ($entry) {
            Check "registry DisplayVersion matches app version ($appVersion)" ($entry.DisplayVersion -eq $appVersion)
            Check "registry Publisher identifies Studio, not FDraft" ($entry.Publisher -eq "FDraft Studio")
            # NSIS's own InstallLocation registry value can come back wrapped in
            # literal double quotes (unlike a bare path) — Join-Path misparses a
            # leading `"` as an attempted drive designator ("Cannot find drive
            # '\"C'") rather than a quote character, so strip it first.
            $installLocation = if ($entry.InstallLocation) { $entry.InstallLocation.Trim('"') } else { $null }
            Check "InstallLocation reported in registry" (![string]::IsNullOrWhiteSpace($installLocation))
            if ($installLocation) {
              $exePath = Join-Path $installLocation "fdraft-studio.exe"
              Check "installed executable exists at InstallLocation" (Test-Path $exePath)
            }
          }

          # currentUser install => per-user Start Menu, not the All Users one.
          $startMenuDir = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs"
          $shortcut = Get-ChildItem -Path $startMenuDir -Filter "FDraft Studio*.lnk" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          Check "Start Menu shortcut created" ($null -ne $shortcut)

          # --- Launch smoke check: does the installed exe start and survive briefly? ---
          if ($exePath -and (Test-Path $exePath)) {
            $appProc = Start-Process -FilePath $exePath -PassThru
            Start-Sleep -Seconds 10
            $stillRunning = -not $appProc.HasExited
            Check "installed app launches and stays running 10s (no immediate crash)" $stillRunning
            if ($stillRunning) { Stop-Process -Id $appProc.Id -Force -ErrorAction SilentlyContinue }
          } else {
            Check "installed app launches and stays running 10s (no immediate crash)" $false
          }

          # Studio's own, separate app-data namespace (identifier
          # com.fdraftstudio.app) — never FDraft's own com.burrichen.fdraft.
          # A passive launch with no real interaction (this smoke check never
          # drives the UI — no WebDriver harness exists for that yet) may
          # never actually write anything here at all: nothing on the Rust
          # side creates it eagerly, and the frontend only does on a real
          # user action (e.g. dismissing the first-run tutorial). So this is
          # recorded, not asserted, before uninstall — the real, assertable
          # requirement is that uninstall never deletes it if it DOES exist,
          # checked after uninstall below.
          $studioAppData = "$env:APPDATA\com.fdraftstudio.app"
          Start-Sleep -Seconds 2
          $appDataExistedBeforeUninstall = Test-Path $studioAppData
          Write-Host "Studio app-data directory ($studioAppData) present before uninstall: $appDataExistedBeforeUninstall"

          # --- Silent uninstall ---
          if ($entry -and $entry.UninstallString) {
            $uninstallExe = ($entry.UninstallString -replace '^"([^"]+)".*$', '$1')
            $uninstallProc = Start-Process -FilePath $uninstallExe -ArgumentList "/S" -PassThru -Wait
            Check "silent uninstall process exits 0" ($uninstallProc.ExitCode -eq 0)

            $entryAfter = $null
            for ($i = 0; $i -lt 10; $i++) {
              $entryAfter = Find-UninstallEntry
              if (-not $entryAfter) { break }
              Start-Sleep -Seconds 1
            }
            Check "uninstall registry entry removed" ($null -eq $entryAfter)
            Check "installed executable removed after uninstall" (-not (Test-Path $exePath))
            $shortcutAfter = Get-ChildItem -Path $startMenuDir -Filter "FDraft Studio*.lnk" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            Check "Start Menu shortcut removed after uninstall" ($null -eq $shortcutAfter)
          } else {
            Check "uninstall registry entry had a UninstallString to run" $false
          }

          # User data must never be deleted by uninstall. This project's pinned
          # @tauri-apps/cli (2.11.4) NsisConfig schema has no delete-app-data
          # option at all (confirmed by reading its own config.schema.json
          # directly — not assumed from docs), so nothing could enable this even
          # by mistake. Only assert survival if it was actually there to begin
          # with — never having been created isn't itself a failure here (see
          # the comment above), but losing an existing one to uninstall would be.
          Check "app-data directory survives uninstall (if it existed)" ((-not $appDataExistedBeforeUninstall) -or (Test-Path $studioAppData))

          $results | ConvertTo-Json | Out-File -FilePath "dist-release/install-verification.json" -Encoding utf8
          Get-Content "dist-release/install-verification.json"

          if ($results.Values -contains $false) {
            Write-Host "::error::One or more install/uninstall verification checks failed."
            exit 1
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fdraft-studio-windows-installer
          path: dist-release/
          retention-days: 30
          if-no-files-found: error

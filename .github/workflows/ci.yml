name: CI

on:
  push:
    branches: [main]
  pull_request:

# Independent jobs per concern, not one monolithic job — a Studio failure
# no longer marks an unrelated SDK job red, and each is diagnosable on its
# own in the GitHub UI. `needs:` is used only where there's a real
# build-output dependency (theme-renderer consumes theme-sdk's built
# `dist/`, not its source — confirmed by this repo's own package
# `exports`), never to serialize unrelated concerns. Each job re-runs
# `pnpm install`/upstream builds on its own fresh checkout rather than
# sharing artifacts across jobs — simpler and more robust than juggling
# upload/download-artifact for a modest speed gain, given this workspace's
# size.
jobs:
  workspace-checks:
    name: Workspace checks (architecture, boundaries, lint, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:architecture
      - run: pnpm run check:boundaries
      - run: pnpm run lint
      - name: Dependency audit (fails on high/critical advisories)
        run: pnpm audit --audit-level=high

  sdk:
    name: "@fdraft/theme-sdk"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fdraft/theme-sdk typecheck
      - run: pnpm --filter @fdraft/theme-sdk test
      - run: pnpm --filter @fdraft/theme-sdk build
      - run: pnpm run check:schemas

  renderer:
    name: "@fdraft/theme-renderer"
    needs: sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fdraft/theme-sdk build
      - run: pnpm --filter @fdraft/theme-renderer typecheck
      - run: pnpm --filter @fdraft/theme-renderer test
      - run: pnpm --filter @fdraft/theme-renderer build

  renderer-lab:
    name: "@fdraft/renderer-lab"
    needs: renderer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fdraft/theme-sdk build
      - run: pnpm --filter @fdraft/theme-renderer build
      - run: pnpm --filter @fdraft/renderer-lab typecheck
      - run: pnpm --filter @fdraft/renderer-lab build

  studio-frontend:
    name: "@fdraft/studio (frontend)"
    needs: renderer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fdraft/theme-sdk build
      - run: pnpm --filter @fdraft/theme-renderer build
      - run: pnpm --filter @fdraft/studio typecheck
      - run: pnpm --filter @fdraft/studio test
      - run: pnpm --filter @fdraft/studio build

  studio-tauri-rust:
    name: "@fdraft/studio (Tauri/Rust)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Linux system libraries Tauri v2 needs even just to `cargo check`/lint its Rust backend.
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential libssl-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/studio/src-tauri

      - run: cargo check --manifest-path apps/studio/src-tauri/Cargo.toml
      - run: cargo fmt --manifest-path apps/studio/src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path apps/studio/src-tauri/Cargo.toml --all-targets -- -D warnings

  # A full `tauri build` (real installers per OS: .dmg/.app, .msi/.exe, .deb/.AppImage)
  # needs a per-OS matrix and is a heavier, separate concern from the fast
  # PR-gating jobs above — see release-studio-windows.yml for the Windows
  # installer specifically (tag-triggered, not run on every push/PR).
